# Fachliche Konfiguration des AI Trading Analyst (Doc 10, Paragraph 17).
#
# Diese Datei enthaelt KEINE Geheimnisse. Zugangsdaten, API-Schluessel und
# Passwoerter kommen ausschliesslich aus Umgebungsvariablen mit dem Praefix
# ATA_ (siehe .env.example).
#
# Unbekannte Schluessel fuehren zu einem Startfehler -- ein Tippfehler soll
# auffallen und nicht still zu einem Default-Wert werden.

market:
  # Der Scheduler rechnet ausschliesslich in dieser Zeitzone. Es darf keine
  # feste deutsche Uhrzeit im Code stehen (Doc 10, Paragraph 6.1).
  timezone: America/New_York
  regular_session_open: "09:30"
  # 390 Minuten regulaere Sitzung = genau zwei 195-Minuten-Kerzen.
  regular_session_minutes: 390
  timeframe_minutes: 195
  # Analysiert wird nach Abschluss der ersten Kerze (12:45 ET).
  daily_candle_index: 1
  # Schlusszeit an verkuerzten Handelstagen -- feste Konvention der
  # US-Aktienmaerkte (Tag nach Thanksgiving, 24.12., 3.7.). Kein Kalender:
  # Nur an dieser Uhrzeit laesst sich ein regulaer verkuerzter Handelstag von
  # einem abgerissenen Datenstrom unterscheiden.
  early_session_close: "13:00"

market_data:
  # Marktdatenanbieter. "fixture" liefert deterministische Testdaten ohne
  # externe Abhaengigkeit, "ibkr" die produktive TWS-Anbindung
  # (docs/adr/0014-ibkr-produktivintegration-freigegeben.md).
  #
  # Der Standard bleibt bewusst "fixture": Die produktive Quelle wird
  # ausdruecklich eingeschaltet und nicht stillschweigend vorausgesetzt --
  # ohne laufende, angemeldete TWS liefert sie keine Daten (ADR 0014, E2).
  provider: fixture
  # Woher die nativen Bars kommen: "stored" aus dem eigenen Bestand, den
  # "cli backfill" fuellt, "live" bei jedem Lauf vom Anbieter.
  #
  # "stored" ist der Standard, weil der regulaere Lauf wiederholbar sein
  # muss: IBKRs Ein-Jahres-Fenster wandert mit der Uhr, schon zwei Laeufe
  # desselben Tages ergaben unterschiedlich viele Kerzen. Ausserdem braucht
  # der Lauf dann keine angemeldete TWS -- nur der Backfill braucht sie.
  # Fuer "fixture" ohne Bedeutung.
  source: stored
  ibkr:
    # Die TWS-API kennt keinen Schluessel; die Berechtigung haengt an der
    # angemeldeten TWS-Sitzung. Hier stehen deshalb keine Geheimnisse.
    host: 127.0.0.1
    # TWS Live 7496, TWS Paper 7497, IB Gateway Live 4001, Paper 4002.
    port: 7496
    # Muss sich von der Client-ID jeder anderen Anwendung an derselben
    # TWS-Instanz unterscheiden (Trade Automation Toolbox: 99).
    client_id: 17
    connect_timeout_seconds: 15
    # 195 Minuten teilen sich ohne Rest durch 15 -- eine Kerze besteht damit
    # aus genau 13 nativen Bars.
    native_bar_minutes: 15
    # Zeitraum je Abruf in IBKR-Schreibweise. Muss den Warm-up von 250 Kerzen
    # (= 125 Handelstage) abdecken, sonst bleibt jede Aktie dauerhaft
    # UNKNOWN_DATA_INCOMPLETE. Fuer die volle Tiefe gibt es den einmaligen
    # Tiefen-Backfill 'cli deepen-history' (ADR 0028); dieser Wert hier
    # steuert nur den regelmaessigen Lueckenschluss.
    history_duration: 1 Y
    # Verzeichnis mit den exportierten Watchlisten (*.txt), relativ zum
    # Projektwurzelverzeichnis. Alle Dateien darin werden eingelesen,
    # Mehrfachnennungen zusammengefasst. Fehlt das Verzeichnis oder ist es
    # leer, bricht der Start ab -- ein Lauf ohne einen einzigen geprueften
    # Titel soll nicht wie ein Erfolg aussehen.
    watchlist_directory: watchlists
    # IBKR laesst 60 Historienanfragen je zehn Minuten zu und sperrt bei
    # Ueberschreitung die ganze Verbindung. 11 Sekunden Abstand bleiben
    # sicher darunter; bei rund 180 Symbolen dauert ein Lauf damit gut
    # 30 Minuten.
    minimum_request_interval_seconds: 11.0

screening:
  # Kandidatenregel: mindestens 2 der 3 Signale innerhalb eines
  # Sechs-Kerzen-Fensters (aktuelle Kerze + 5 vorherige). Unabhaengig von
  # Gate G1, weil die Regel nichts ueber die mathematische Definition der
  # einzelnen Signale aussagt (G1-Pruefvorlage, Abschnitt 3).
  required_signal_count: 2
  # Anzahl zusaetzlicher, vorheriger Kerzen -- die aktuelle Kerze kommt immer
  # dazu. Frueher lookback_closed_candles; umbenannt, weil dieser Name
  # zwischen Fenstergroesse und Anzahl-Vorkerzen missverstaendlich war.
  signal_lookback_previous_candles: 5
  direction: LONG

backtesting:
  history_years: 5
  horizons: [5, 10, 20]
  # Freigegeben als F5: Cooldown nach jedem gezaehlten Ereignis, damit
  # geclusterte Qualifikationen die Stichprobe nicht aufblaehen.
  cooldown_candles: 5
  # Konfidenzstufen nach F6.
  minimum_sample_size: 10
  normal_confidence_sample_size: 30

earnings_filter:
  minimum_exclusion_candles: 10
  maximum_exclusion_candles: 20
  # Konservative Grenze fuer das MVP (Doc 10, Paragraph 6.5).
  configured_exclusion_candles: 20
  # "fixture" bleibt Standard -- Start und Tests laufen ohne Finnhub-Zugang.
  provider: fixture
  # Kalendertage je Anfrage. Stand bis ADR 0043 unter
  # 'earnings_filter.finnhub'; Host und Zeitgrenze sind in den eigenen
  # Abschnitt 'finnhub' gewandert, weil sie seither zwei Endpunkten gehoeren.
  # Der alte Schluesselort fuehrt zum Startfehler, nicht zu einem Default --
  # eine still uebergangene Umbenennung waere schlimmer als ein Abbruch.
  #
  # 120 statt der urspruenglichen 30 (Nachtrag zu ADR 0017): Der Termin hat
  # seit ADR 0046/0048 drei Verbraucher, und nur der erste kam mit 30 aus --
  # das Ausschlussfenster (10 Handelstage), die Kennzeichnung
  # earnings_within_term der Optionsanalyse (Verfaelle bis 60 Tage voraus)
  # und der Empfehlungsdeckel cap_earnings_unknown. Quartalsberichte kommen
  # nur ~alle 90 Tage: Mit 30 Tagen war der Termin bei rund zwei Dritteln
  # der Kandidaten "unbekannt", und deren Empfehlung blieb dauerhaft
  # gedeckelt. 120 deckt einen vollen Quartalszyklus mit Reserve; der Spike
  # mass ueber vier Monate 97 % Abdeckung. Ein groesseres Fenster ist ein
  # reiner Query-Parameter -- es kostet keine zusaetzliche Anfrage.
  lookahead_calendar_days: 120

# Analystenempfehlungen (Doc 10, Paragraph 6.12 Punkt 9; ADR 0043).
# Kursziele gibt es hier bewusst nicht: Der Endpunkt ist kostenpflichtig,
# und keine der zehn Score-Komponenten braucht sie (ADR 0043).
analyst_ratings:
  # Wie beim Earnings-Filter: "fixture" ist Standard, "finnhub" wird im
  # Tageslauf ueber --ratings-provider ausdruecklich eingeschaltet.
  provider: fixture
  # Monatsstaende. Vier, weil die Veraenderung der Analystenmeinung mehr
  # aussagt als der Momentanstand -- und weil sie nichts kosten.
  months: 4

# Zugang zum Finnhub-Konto. Ein Konto, ein Schluessel, ein Host -- und seit
# ADR 0043 zwei Endpunkte (Earnings-Kalender und Analystenempfehlungen).
# Der Zugangsschluessel steht nicht hier, sondern ausschliesslich in einer
# ATA_-Umgebungsvariablen -- welche, sagt .env.example (ADR 0005).
finnhub:
  base_url: https://finnhub.io/api/v1
  request_timeout_seconds: 10
  # Gemessen, nicht geraten: Der Messlauf ueber die Watchliste vom
  # 2026-08-31 lief mit rund einer Anfrage je Sekunde und verlor vier von
  # 192 Symbolen an "429 Too Many Requests". Die Gratis-Stufe deckelt bei
  # 60 je Minute; 0,8 haelt Abstand. Gilt fuer beide Endpunkte -- das Limit
  # gilt fuer das Konto, nicht fuer den Endpunkt.
  max_requests_per_second: 0.8

technical_analysis:
  # Deterministische Chartauswertung (Doc 10, Paragraph 6.8; ADR 0025).
  # Nicht Teil von Gate G1 -- diese Werte beeinflussen keine Signalformel und
  # keine Kandidatenentscheidung, sondern nur die Beschreibung der Lage.
  #
  # Kerzen links und rechts eines Swing-Punktes. Die juengsten 3 Kerzen
  # koennen deshalb noch keinen Wendepunkt bilden: Ein unbestaetigter
  # Wendepunkt ist keiner.
  pivot_reach: 3
  # Wie weit ein Wendepunkt vom Mittelwert eines Buendels entfernt sein
  # darf, um noch dazuzugehoeren -- ein Bruchteil: 0.015 sind 1,5 %, nicht
  # 1,5. Bestimmt nur die Buendelung; die Zone selbst ist so breit wie die
  # Spanne ihrer Wendepunkte (ADR 0025, Revisionsabschnitt).
  zone_tolerance_pct: 0.015
  # Eine einmal beruehrte Preisregion ist noch keine Zone. Ein nie wieder
  # angelaufenes Verlaufshoch faellt damit heraus -- es steht weiterhin
  # als juengstes Hoch in der Auswertung.
  min_touches: 2
  # Staerke folgt der Zahl der Wendepunkte, nicht der Beruehrungen: Eine
  # Beruehrung ist auch das blosse Durchlaufen, ein Wendepunkt ist ein
  # Anlauf mit Umkehr.
  moderate_pivot_count: 3
  strong_pivot_count: 5
  # Obergrenze je Seite, nach Naehe zum Kurs.
  max_zones_per_side: 3
  # Fenster der Zonensuche in Kerzen -- bei zwei Kerzen je Handelstag rund
  # ein halbes Jahr, der Horizont eines Swing-Trades.
  history_candles: 250
  atr_length: 14
  # Kerzen, ueber die die Steigung des EMA20 gemessen wird, und die
  # Aenderung, unterhalb derer der Trend als seitwaerts gilt -- ebenfalls
  # ein Bruchteil: 0.005 sind 0,5 %.
  trend_lookback: 10
  trend_flat_pct: 0.005
  # Fenster fuer die juengsten Hoch- und Tiefpunkte (rund vier Wochen).
  extremes_lookback: 40

llm:
  # Anbieter und Modellstufen je Analyseaufgabe
  # (docs/adr/0021-ki-anbindung-anthropic-api.md). Guenstigere Modelle fuer
  # Aufgaben mit geringerer Analysetiefe, das staerkere Modell konzentriert
  # auf die Research-Aufgabe.
  #
  # Modell-Identifier vor dem ersten produktiven Lauf gegen den dann
  # aktuellen Anthropic-Katalog und dessen Preise pruefen -- sie aendern
  # sich unabhaengig von diesem Projekt.
  #
  # fallback_model greift NUR bei technischem Versagen -- Timeout,
  # Verbindungsabbruch, Ratenlimit, 5xx (ADR 0037). Ein 400 oder 404 schlaegt
  # sofort durch: Ein vertippter Modellname soll auffallen und nicht still
  # ein anderes Modell verwenden.
  #
  # Ausgewichen wird jeweils auf die ANDERE Stufe, auch nach oben. Der
  # haeufigste technische Ausfall ist das Ratenlimit, und das zaehlt je
  # Modell getrennt -- ein Ausweichmodell derselben Stufe brachte nichts. Die
  # verwendete Modellversion steht an jedem Ergebnis, die Abweichung ist also
  # sichtbar und keine stille Qualitaetsaenderung (ADR 0021).
  provider: anthropic
  research:
    model: claude-sonnet-5
    fallback_model: claude-haiku-4-5-20251001
  technical:
    model: claude-haiku-4-5-20251001
    fallback_model: claude-sonnet-5
  fundamental:
    model: claude-haiku-4-5-20251001
    fallback_model: claude-sonnet-5
  report:
    model: claude-haiku-4-5-20251001
    fallback_model: claude-sonnet-5

research:
  # Recherchequellen des Research Agent
  # (docs/adr/0022-research-agent-quellen.md), Zitierarchitektur und
  # Kostensteuerung in ADR 0023. "fixture" bleibt Standard -- Start und
  # Tests laufen ohne Anthropic-Zugang.
  #
  # "none" schaltet den Agenten bewusst ab: UNAVAILABLE mit Grund
  # provider_disabled statt eines Fixture-Schein-Ergebnisses. Der Weg fuer
  # einen Scharfbetrieb ohne Recherche-Kosten -- fixture waere dort falsch,
  # weil seine Beispieltexte im Bericht wie ein Ergebnis aussaehen.
  provider: fixture
  # Kostenbudget je Aktie (ADR 0021, ADR 0023 "Kostenkontrolle").
  #
  # Wichtig zum Verstaendnis: web_search/web_fetch sind serverseitige
  # Werkzeuge, deren Schleife bis zu zehn Iterationen INNERHALB EINER
  # EINZIGEN Anfrage laeuft, und der angesammelte Kontext wird bei jeder
  # Iteration erneut als Eingabe verrechnet. Ein ungebremst abgerufenes
  # SEC-Filing (~125.000 Token) schlaegt also vielfach zu Buche -- ein realer
  # Lauf kam so auf 256.000 Eingabe-Token und rund 0,62 USD ohne Ergebnis.
  max_searches: 5
  max_fetches: 3
  # Der wirksamste Hebel: max_fetches * dieser Wert ist das eigentliche
  # Budget an Dokumentinhalt (hier ~24.000 Token).
  max_fetch_content_tokens: 8000
  # Notbremse zwischen zwei Anfragen (~0,30 USD). Eine bereits laufende
  # Anfrage laesst sich nicht abbrechen -- dort wirken nur max_uses und
  # max_fetch_content_tokens.
  max_input_tokens_per_symbol: 150000
  # Deckelt Denken UND Antworttext gemeinsam: Auf Sonnet 5 laeuft ein Aufruf
  # ohne thinking-Feld mit adaptivem Denken, und beides teilt sich dasselbe
  # Budget. Zu knapp schneidet es den Werkzeugaufruf ab, statt zu sparen.
  max_output_tokens: 16000
  # Lesezeit je Anfrage; der Verbindungsaufbau hat einen eigenen, kurzen
  # Wert (VERBINDUNGSAUFBAU_SEKUNDEN im Adapter). Ein Skalar-Timeout legte
  # frueher denselben Wert auf beides.
  #
  # Gleichzeitige Recherche-Aufrufe -- EIGENER Pool, getrennt vom Technical
  # Agent (ADR 0037, Risiko R9). Bewusst klein: Ein Aufruf dauert rund 15
  # Minuten und kostet ~0,58 USD. Mehr Nebenlaeufigkeit verkuerzt nicht den
  # einzelnen Aufruf, sie erhoeht nur, wie viele teure Gespraeche gleichzeitig
  # offen sind.
  max_concurrent_calls: 2
  # Frueher 300. Am 2026-08-24 lagen 921 Sekunden zwischen zwei Logzeilen --
  # 300 + 300 + ~320, also zwei abgelaufene Versuche und ein erfolgreicher.
  # Die teuerste Form des Fehlschlags: Eine abgelaufene Anfrage erzeugt
  # clientseitig keine Logzeile, serverseitig sind die Token trotzdem
  # angefallen und fehlen in jeder Kostenschaetzung.
  request_timeout_seconds: 900
  # Keine Wiederholung, ausdruecklich statt SDK-Standard (2). Das SDK
  # unterscheidet nicht nach Fehlerart: APITimeoutError gilt ihm
  # bedingungslos als wiederholbar. Eine Wiederholung traefe damit genau den
  # Fall, gegen den der lange Lesetimeout gebaut ist -- 900 s mal zwei
  # Versuche sind 1800 s Blockade eines der research-Plaetze, gegen 900 s
  # beim alten Stand (300 s mal drei). Und der zweite Versuch startet die
  # serverseitige Werkzeugschleife von vorn.
  #
  # Ein ausgefallener Bericht kostet dagegen wenig: Er wird UNAVAILABLE und
  # blockiert die technische Analyse nie.
  max_retries: 0
  # Allowlist statt Blockliste (ADR 0023, Zitierarchitektur Punkt 5) -- gilt
  # aber NUR fuer den Abruf. Die Suche laeuft bewusst offen: Eine Allowlist
  # auf der Suche laesst kaum Treffer uebrig, das Modell verbrennt sein
  # Suchkontingent, und web_fetch erreicht danach nichts mehr (es darf nur
  # URLs holen, die vorher in Suchtreffern standen). Breit suchen, eng
  # vertiefen.
  #
  # Nicht jede serioese Quelle ist abrufbar: Wer Anthropics Crawler
  # aussperrt, laesst die gesamte Anfrage mit einem 400 scheitern, nicht nur
  # den einzelnen Abruf. Reuters und AP sind aus genau diesem Grund nicht
  # hier. Vor dem Aufnehmen einer neuen Domain also einen echten Lauf machen.
  fetch_allowed_domains:
    # Primaerquellen
    - sec.gov
    # Unternehmensmeldungen im Original -- fuer Quartalszahlen, Rueckkaeufe
    # und Personalien ohnehin die bessere Quelle als eine Agenturmeldung
    - prnewswire.com
    - businesswire.com
    - globenewswire.com
    - nasdaq.com
  # Obergrenze der gespeicherten Belege je Bericht (ADR 0029). An einem echten
  # Lauf bemessen: Der AAPL-Lauf vom 2026-08-24 brachte 38 Zitate aus 19
  # verschiedenen Quellen. Bei 15 haette die Deckelung vier Quellen ganz
  # verloren, obwohl sie gerade die Vielfalt schuetzen soll; ab 20 ueberleben
  # alle. Gedeckelt wird reihum je Quelle, nicht der Reihe nach; die Zahl der
  # verworfenen Zitate steht am Bericht.
  max_citations: 25
  # Nur fuer die Kostenschaetzung im Log. VON HAND GEPFLEGT -- die Anwendung
  # fragt keine Preisliste ab, ein veralteter Wert faellt nirgends auf.
  #
  # Stand 2026-08-22, gegen den Anthropic-Katalog geprueft: Sonnet 5 kostet
  # regulaer 3,00 / 15,00 USD je Million, die Websuche 10 USD je 1000.
  #
  # Hier stehen bewusst die REGULAEREN Preise, obwohl bis einschliesslich
  # 2026-08-31 noch die Einfuehrungspreise (2,00 / 10,00) gelten: Die Werte
  # speisen ausschliesslich die Schaetzung im Protokoll, nicht die
  # eigentliche Bremse (max_input_tokens_per_symbol). Zu hoch schaetzen ist
  # damit die ungefaehrliche Richtung -- und es erspart eine zweite Aenderung
  # mitten im Betrieb. Bis zum Stichtag liegt die Schaetzung rund ein Drittel
  # ueber den tatsaechlichen Kosten.
  pricing:
    input_usd_per_million: 3.0
    output_usd_per_million: 15.0
    usd_per_search: 0.01

technical_agent:
  # KI-Interpretation der deterministischen Chartauswertung (Doc 10,
  # Paragraph 6.8 "Qualitative Interpretation"; ADR 0026). Das Modellprofil
  # steht in llm.technical -- hier stehen nur Anbieter und Budget.
  #
  # Nicht zu verwechseln mit dem Abschnitt technical_analysis weiter oben:
  # Dort stehen die Verfahrensparameter der Berechnung, die nach Doc 14 am
  # echten Chart nachgezogen werden. Die KI verändert davon nichts.
  #
  # "fixture" bleibt Standard -- Start und Tests laufen ohne Anthropic-Zugang
  # (Muster research.provider). "none" schaltet den Agenten bewusst ab:
  # UNAVAILABLE statt der Fixture-Einstufungen, die im Scharfbetrieb 30
  # Prozent des Swing-Scores mit identischen Konstanten fuellen wuerden.
  provider: fixture
  # Eine einzige Anfrage ohne Werkzeuge: sechs Einstufungen und ein kurzer
  # Text. 2000 Token sind dafür reichlich. Zu knapp bemessen schneidet es den
  # Werkzeugaufruf ab, und ein abgeschnittener Aufruf wird verworfen, nicht
  # halb verwertet.
  max_output_tokens: 2000
  # Gleichzeitige Einordnungen -- EIGENER Pool, getrennt von research
  # (ADR 0037, Risiko R9). Groesser als dort, weil eine Einordnung Sekunden
  # dauert und Bruchteile eines Cents kostet. Vorher teilten sich beide
  # Agenten vier Plaetze, und eine haengende Recherche belegte bis zu 900 s
  # einen davon, waehrend die kurzen Einordnungen warteten.
  max_concurrent_calls: 4
  # Deutlich kürzer als bei research (900 s): Dort laufen serverseitige
  # Werkzeuge, hier ist es eine einzelne Anfrage ohne sie.
  request_timeout_seconds: 60
  # Ausdrücklich statt SDK-Standard -- hier zufällig derselbe Wert. Anders
  # als bei research ist eine Wiederholung billig: eine einzelne Anfrage
  # ohne Werkzeugschleife, gedeckelt durch max_output_tokens.
  max_retries: 2
  # Nur für die Kostenschätzung im Protokoll, VON HAND GEPFLEGT -- die
  # Anwendung fragt keine Preisliste ab. Vor dem ersten produktiven Lauf
  # gegen den dann aktuellen Anthropic-Katalog prüfen.
  pricing:
    input_usd_per_million: 1.0
    output_usd_per_million: 5.0

fundamentals:
  # Deterministische Fundamentalanalyse (Doc 10, Paragraph 6.9; ADR 0032).
  # Quelle sind die SEC-Einreichungen, direkt und ohne Sprachmodell im
  # Beschaffungspfad (ADR 0022).
  #
  # "fixture" bleibt Standard -- Start und Tests laufen ohne Netzzugriff
  # (Muster technical_agent.provider).
  provider: fixture
  # Spanne der Wachstumsraten in Geschäftsjahren. Sie wird VOLLSTÄNDIG
  # verlangt: Ein Unternehmen mit kürzerer Historie liefert keine
  # Wachstumsrate, statt eine über zwei Jahre neben einer über drei zu
  # stellen, die gleich aussieht und keine ist.
  growth_years: 3
  edgar:
    base_url: https://data.sec.gov
    # Getrennt, weil das Symbolverzeichnis unter www.sec.gov liegt und die
    # Fakten unter data.sec.gov.
    index_base_url: https://www.sec.gov
    # Die von der SEC im User-Agent geforderte Kontaktadresse steht NICHT
    # hier, sondern als ATA_EDGAR_CONTACT in der Umgebung. Kein Geheimnis im
    # Wortsinn -- aber dieses Repository ist öffentlich, und eine private
    # Mailadresse gehört nicht hinein. Ohne sie antwortet die SEC mit 403;
    # der Start bricht deshalb vorher ab statt mitten im Lauf.
    # Großzügig: companyfacts ist je Aktie mehrere Megabyte groß (ADR 0032 L6).
    request_timeout_seconds: 60
    # Unter der von der SEC genannten Obergrenze von zehn. Der Abstand ist
    # Absicht -- eine Drossel genau auf der Grenze überschreitet sie bei
    # jeder Ungenauigkeit der Uhr.
    max_requests_per_second: 8.0

data_availability:
  # Der Lauf startet ab Kerzenschluss, rechnet aber erst nach nachgewiesener
  # Vollstaendigkeit der Kerze (Risiko R9).
  grace_period_seconds: 60
  poll_interval_seconds: 30
  max_wait_seconds: 1800

scheduler:
  # Zeitsteuerung des taeglichen Laufs (docs/adr/0019-trading-day-dispatcher.md).
  # Die Aufgabenplanung startet alle 15 Minuten in einem Abendfenster;
  # entschieden wird hier, in der Zeitzone der Boerse.
  #
  # Wartezeit nach Kerzenschluss: Die Kerze ist um 12:45 New Yorker Zeit zu,
  # beim Anbieter aber nicht zwingend im selben Augenblick vollstaendig.
  # 300 Sekunden ergeben einen fruehesten Start um 12:50.
  safety_buffer_seconds: 300
  # Danach gilt der Lauf als ausgefallen und es geht eine Meldung raus.
  # Zwei Stunden ab 12:50 ergeben eine Frist um 14:50 New Yorker Zeit. Der
  # Wert muss innerhalb des Startfensters der Aufgabenplanung liegen, sonst
  # kommt die Meldung erst am naechsten Tag (README).
  max_catch_up_seconds: 7200
  # Ab welchem Anteil gerechneter Aktien der Lauf als erledigt gilt. Der
  # Analyse-Lauf isoliert Fehler je Aktie und bricht nicht ab -- ohne diese
  # Schwelle waere auch ein Abend als erledigt verbucht worden, an dem die
  # Verbindung nach der ersten Aktie abriss. Nicht 1.0, weil eine einzelne
  # dauerhaft stumme Aktie sonst jeden Abend den ganzen Lauf blockierte.
  minimum_completion_ratio: 0.9

notifications:
  send_when_no_candidates: false
  # Ausgeliefert bewusst 'dry_run' -- der Kanal ist seit ADR 0024 Telegram,
  # aber ein produktiver Server soll ihn ueber das Argument in der
  # Aufgabenplanung scharf schalten, nicht ueber diese Datei (dasselbe Muster
  # wie bei den Anbietern von Earnings-Filter und Research Agent).
  channel: dry_run
  telegram:
    # Kein Geheimnis: Die Chat-ID adressiert nur, ohne den Bot-Token aus
    # ATA_NOTIFICATION_TOKEN kann niemand damit senden. Ohne gesetzte chat_id
    # bricht 'channel: telegram' vor dem Lauf ab (ADR 0024).
    chat_id: null
    base_url: https://api.telegram.org
    request_timeout_seconds: 10

options:
  # Optionsanalyse: ausschließlich Cash Secured Puts (Doc 08; Doc 10,
  # Paragraph 6.10; ADR 0048). Läuft nur für Kandidaten -- eine Optionskette
  # für jeden Titel der Watchliste wäre ein Vielfaches an Abrufen ohne Nutzen.
  #
  # "fixture" bleibt Standard: Start, Tests und CI laufen damit ohne laufende
  # TWS und ohne Optionsmarktdaten-Abo.
  provider: fixture
  # IBKRs Marktdatenmodus: 1 live, 2 "frozen", 3 verzögert, 4 verzögert+frozen.
  #
  # Der Tageslauf steht auf der ERSTEN 195-Minuten-Kerze (market.daily_candle_index:
  # 1), die um 12:45 New Yorker Zeit schließt. Nach dem Kerzen-Backfill sind
  # die Optionen gegen 13:15 ET dran, spätestens gegen 15:15 (die Nachholfrist
  # aus scheduler.max_catch_up_seconds beträgt zwei Stunden). Der Optionsmarkt
  # ist im gesamten Fenster offen -- gemessen am 2026-08-31 um 13:02 ET:
  # modellierte Greeks kamen zurück.
  #
  # Trotzdem 2 und nicht 1: "frozen" verhält sich bei offener Börse wie live
  # und liefert bei geschlossener den letzten festgestellten Stand statt
  # nichts. Das kostet im Regelfall nichts und macht eine Einzelprobe am
  # Abend brauchbar.
  market_data_type: 2
  # Zielfenster der Restlaufzeit in KALENDERTAGEN -- was ZULÄSSIG ist.
  #
  # Die Obergrenze ist gerechnet, nicht gewählt: Zwei aufeinander folgende
  # dritte Freitage liegen 28 oder 35 Tage auseinander. Ein Fenster schmaler
  # als 35 Tage kann deshalb zwischen zwei Monatsverfälle fallen -- beim
  # Messlauf am 2026-08-31 fielen so 77 von 192 Titeln aus, weil der
  # Septemberverfall 18 und der Oktoberverfall 46 Tage entfernt lag. Ab
  # Breite 35 (also 21 bis 56) kann das nicht mehr passieren; 60 lässt
  # Reserve.
  min_days_to_expiration: 21
  max_days_to_expiration: 60
  # Die bevorzugte Restlaufzeit INNERHALB des Fensters -- was GEWÄHLT wird.
  # Bei Gleichstand gewinnt der frühere Termin.
  #
  # Getrennt von den Grenzen, damit die Verbreiterung des Fensters nicht
  # zugleich die übliche Laufzeit verschiebt: Mit 35 Tagen fällt die Wahl für
  # Titel mit Wochenoptionen genauso aus wie zuvor -- am 2026-08-31 auf den
  # 2. Oktober --, während Titel mit reinen Monatsverfällen den Oktobertermin
  # bekommen statt gar keinen.
  target_days_to_expiration: 35
  # Zielband des Delta-BETRAGS. Es wird erst NACH dem Abruf angewandt: Vor
  # der Notierung ist das Delta nicht bekannt, und ein geschätztes wäre ein
  # erfundener Wert.
  #
  # Das Band ist breit, und das hat eine sichtbare Folge: Die annualisierte
  # Rendite steigt innerhalb eines Verfallstermins nahezu monoton mit dem
  # Delta, der oberste Vorschlag steht deshalb fast immer am oberen Rand.
  # Genau darum sind es drei Vorschläge und nicht einer -- Delta, Abstand zum
  # Kurs und Abstand zur Unterstützung stehen an jedem.
  min_delta: 0.10
  max_delta: 0.40
  # Vorauswahl der Strikes als Anteil des Kurses. Sie ersetzt das Delta-Band
  # nicht, sondern begrenzt nur, wie viele Kontrakte überhaupt notiert werden
  # -- jede Notierung kostet eine Marktdatenanfrage.
  min_moneyness: 0.80
  max_moneyness: 0.99
  max_strikes: 12
  max_suggestions: 3
  # Liquiditätsschwellen. GESETZT, nicht gemessen: Sie tragen keinen
  # Score-Teilwert, sondern erzeugen Warnungen. Ein Vorschlag mit zwei oder
  # mehr Warnungen gilt als POOR und steht nie an erster Stelle -- er wird
  # aber auch nicht verschwiegen (Doc 10, Paragraph 6.10).
  #
  # Nicht gelieferte Werte erzeugen KEINE Warnung: Fehlende Werte bestrafen
  # nicht. Open Interest fordert reqTickers nicht standardmäßig an und fehlt
  # deshalb oft.
  max_relative_spread: 0.10
  min_open_interest: 100
  min_volume: 10

scoring:
  # 1.2: Die Optionsattraktivitaet rechnet mit (ADR 0048) -- der Score steht
  # auf 100 statt 90 Prozent Abdeckung. Alle sechs Komponenten sind gefuellt.
  swing_version: "1.2"
  long_term_version: "1.0"
  # Untergrenze der Datenabdeckung: darunter entsteht kein Score, sondern
  # INSUFFICIENT_DATA (Doc 09). Gesetzt, nicht gemessen -- sie ist der Punkt,
  # an dem "fehlende Daten werden sichtbar behandelt" von einer Kennzeichnung
  # zu einer Folge wird.
  minimum_coverage: 0.6
  # Ab hier gilt der Score als NORMAL belastbar, darunter als LOW_COVERAGE.
  normal_confidence_coverage: 0.8
  # Die Empfehlungsstufe, Berichtspunkt 16 (ADR 0046). Gesetzt, nicht
  # gemessen: Eine Empfehlung liesse sich erst an realisierten Ausgaengen
  # kalibrieren. Die Stufengrenzen sind immerhin von der Skala abgelesen, aus
  # der der Swing-Score gebaut ist (2/4/6/8/10), und nicht gegriffen.
  recommendation:
    # Grundstufe aus dem Swing-Score.
    strong_candidate: 8.0
    candidate: 6.0
    watch: 4.0
    # Der Investment-Score hebt oder senkt um hoechstens eine Stufe. Ein
    # fehlender korrigiert nicht -- fehlende Daten bestrafen nicht.
    investment_strong: 8.0
    investment_weak: 4.0
    # Begrenzende Risiken. Sie koennen nur senken, nie heben.
    cap_false_signal_high: WATCH
    cap_earnings_unknown: CANDIDATE
    version: "1.0"
  # Komponentengewichte nach ADR 0041. Beide Saetze muessen sich auf 1.0
  # summieren; die Umgewichtung bei fehlenden Komponenten rechnet der
  # Aggregator.
  swing_weights:
    technical_signals: 0.25
    signal_statistics: 0.25
    chart_setup: 0.15
    chance_risk: 0.15
    news_and_events: 0.10
    options_attractiveness: 0.10
  long_term_weights:
    profitability: 0.30
    growth: 0.25
    valuation: 0.25
    balance_sheet_quality: 0.20
  # Aelter darf der juengste Monatsstand der Analystenvoten nicht sein.
  # Gesetzt: Die Voten erscheinen monatlich, 62 Tage lassen einen
  # ausgefallenen Stand durchgehen, zwei nicht mehr. Der Endpunkt selbst
  # kennt keine Schranke.
  analyst_max_age_days: 62
  # Die News- und Ereignislage steht auf dem Anteil der Kauf-Voten am
  # juengsten Monatsstand (ADR 0046). Fuenftelgrenzen aus dem Lauf ueber 187
  # Titel der Watchliste vom 2026-08-31, gemessen mit
  # `cli ratings --watchlist --output` und `cli calibrate-scores`.
  analyst_buy_share:
    boundaries: [0.4362, 0.5758, 0.6988, 0.8182]
    higher_is_better: true
  # Die Optionsattraktivitaet steht auf der annualisierten Praemienrendite des
  # bestbewerteten Cash-Secured-Put-Vorschlags (ADR 0048). Fuenftelgrenzen aus
  # dem Lauf ueber 192 Titel der Watchliste vom 2026-08-31, 186 davon mit
  # Wert, gemessen mit `cli options --watchlist --output` und
  # `cli calibrate-scores`.
  #
  # Kurzlebiger als die uebrigen Schwellen, und das gehoert benannt: Praemien
  # steigen und fallen mit der Marktvolatilitaet gemeinsam, waehrend sich
  # Fundamentalkennzahlen quartalsweise bewegen. Eine unruhige Phase
  # verschiebt die ganze Verteilung nach oben.
  options_annualized_return:
    boundaries: [0.1388, 0.1968, 0.2464, 0.3244]
    higher_is_better: true
  # Fuenftelgrenzen aus dem Lauf ueber 191 Titel der Watchliste vom
  # 2026-08-31 (ADR 0045), ausgewertet mit `cli calibrate-scores`. Gemessen,
  # nicht gesetzt: Ein geratener Teilwert ist eine erfundene Zahl.
  #
  # boundaries sind die Grenzen bei 20/40/60/80 Prozent, aufsteigend.
  # higher_is_better sagt, in welche Richtung bewertet wird -- bei KGV, KUV,
  # Kurs/FCF, Verschuldungsgrad und Verwaesserung ist niedriger besser.
  thresholds:
    # Profitabilitaet
    GROSS_MARGIN:
      boundaries: [0.3337, 0.4385, 0.5833, 0.6828]
      higher_is_better: true
    OPERATING_MARGIN:
      boundaries: [0.0840, 0.1504, 0.2145, 0.3298]
      higher_is_better: true
    NET_MARGIN:
      boundaries: [0.0663, 0.1092, 0.1727, 0.2745]
      higher_is_better: true
    FREE_CASH_FLOW_MARGIN:
      boundaries: [0.0668, 0.1218, 0.1821, 0.2828]
      higher_is_better: true
    RETURN_ON_EQUITY:
      boundaries: [0.0961, 0.1587, 0.2441, 0.3813]
      higher_is_better: true
    RETURN_ON_ASSETS:
      boundaries: [0.0311, 0.0622, 0.0985, 0.1575]
      higher_is_better: true
    # Wachstum
    REVENUE_GROWTH:
      boundaries: [0.0145, 0.0511, 0.0864, 0.1317]
      higher_is_better: true
    NET_INCOME_GROWTH:
      boundaries: [-0.0623, 0.0363, 0.1150, 0.2620]
      higher_is_better: true
    # Bewertung -- niedriger ist besser
    PRICE_EARNINGS_RATIO:
      boundaries: [16.41, 23.30, 31.16, 39.81]
      higher_is_better: false
    PRICE_SALES_RATIO:
      boundaries: [1.57, 2.92, 4.88, 7.46]
      higher_is_better: false
    PRICE_FREE_CASH_FLOW_RATIO:
      boundaries: [15.24, 20.49, 27.23, 40.10]
      higher_is_better: false
    # Bilanzqualitaet
    DEBT_TO_EQUITY:
      boundaries: [0.6085, 1.0694, 1.7143, 3.3968]
      higher_is_better: false
    CURRENT_RATIO:
      # Monoton steigend bewertet, obwohl er das nicht ist: Ein Wert von 7,6
      # ist gebundenes Kapital, nicht Staerke. Bekannte Vereinfachung,
      # ausgewiesen in ADR 0045.
      boundaries: [0.8656, 1.1152, 1.4745, 2.2839]
      higher_is_better: true
    SHARE_COUNT_GROWTH:
      # Positiv heisst mehr Aktien, also Verwaesserung -- niedriger ist besser.
      boundaries: [-0.0259, -0.0160, -0.0036, 0.0052]
      higher_is_better: false

logging:
  level: INFO
  format: json

