# GATE G1 -- fachlich freigegeben (docs/adr/0010-gate-g1-freigegeben.md).
#
# Werte aus docs/requirements/g1-pruefvorlage.md, Abschnitt 1.2 und 1.3.
# ---------------------------------------------------------------------------
indicators:
  rsi_length: 14
  rsi_method: wilder
  rsi_ma_length: 14
  rsi_ma_type: sma
  fast_ema_length: 5
  slow_ema_length: 20
  warmup_candles: 250
