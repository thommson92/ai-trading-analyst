[project]
name = "tvcdp-spike"
version = "0.1.0"
description = "Gate G2 -- technischer Spike zur TradingView-Desktop-Anbindung ueber CDP. Kein Produktivcode."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=12,<14",
    "click>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
tvcdp = "tvcdp.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
