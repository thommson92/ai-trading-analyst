[project]
name = "ai-trading-analyst"
version = "0.1.0"
description = "KI-gestuetztes Trading-Analyse-System fuer Long-Swing-Trades"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0,<7",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    # Offizielle TWS-API von Interactive Brokers, gekapselt von ib_async
    # (gepflegter Nachfolger von ib_insync). Freigegeben in ADR 0014.
    "ib_async>=1.0,<2",
    # Windows liefert keine System-Zeitzonendatenbank; ohne dieses Paket
    # scheitert dort jede ZoneInfo("America/New_York") -- im IBKR-Spike auf
    # dem Zielserver aufgetreten (REPORT.md, Frage 3).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0,<7",
    "httpx>=0.27,<1",
]
# Nur zum Regenerieren der Lock-Dateien (requirements*.lock.txt), keine
# Laufzeit- oder Testabhaengigkeit. Siehe ADR 0008.
lock = [
    "pip-tools>=7.4,<8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_trading_analyst = ["infrastructure/fixtures/data/**/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez -- keine naiven Zeitstempel
    "RUF",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPIs Depends(...)/Query(...) in Funktions-Defaults sind das idiomatische
# Dependency-Injection-Muster, kein Bug (B008 waere sonst ein Dauer-Fehlalarm).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ib_async ist nicht durchgaengig typannotiert. Die Ausnahme gilt bewusst nur
# fuer die Bibliothek selbst -- der eigene Adapter darum herum bleibt strikt
# geprueft.
[[tool.mypy.overrides]]
module = "ib_async.*"
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "architecture: prueft die Schichtgrenzen aus Doc 10 Paragraph 9",
]
