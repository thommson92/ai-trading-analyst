# Automatische Aktualisierungs-Pull-Requests.
#
# **Ohne Python.** Die Lock-Dateien entstehen mit `uv pip compile
# --generate-hashes` aus `pyproject.toml` (ADR 0015); Dependabot kann sie
# nicht neu erzeugen, sondern nur Zeilen darin umschreiben. Das Ergebnis
# waere eine Lock-Datei, die nicht mehr zu ihrer Quelle passt -- schlimmer
# als eine veraltete. Fuer die Python-Seite meldet stattdessen der
# Workflow `audit.yml`, und Dependabots Sicherheitswarnungen wirken
# ohnehin ohne diese Datei.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Ein PR statt fuenf: Die Entwicklungswerkzeuge haengen aneinander,
      # und einzeln aktualisiert brechen sie sich gegenseitig.
      werkzeuge:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
