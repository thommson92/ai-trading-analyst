name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Ein neuer Push auf denselben Branch macht den vorherigen Lauf ueberfluessig.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy (strict)
        run: python -m mypy src tests

      - name: Pytest
        run: python -m pytest

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build

  secrets:
    name: Keine Geheimnisse im Repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Doc 10, Paragraph 20: "keine API-Schluessel oder Passwoerter im
      # Repository". Die Pruefung ist bewusst grob -- sie soll den
      # offensichtlichen Fehler abfangen, nicht Geheimnisse forensisch suchen.
      - name: .env darf nicht eingecheckt sein
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env ist eingecheckt und muss aus dem Repository entfernt werden"
            exit 1
          fi

      - name: Konfiguration enthaelt keine geheimnisverdaechtigen Schluessel
        run: |
          if grep -nEi '^[[:space:]]*[a-z_]*(password|api_key|apikey|token|secret)[[:space:]]*:' \
              config/default.yaml; then
            echo "::error::config/default.yaml enthaelt einen geheimnisverdaechtigen Schluessel"
            exit 1
          fi
