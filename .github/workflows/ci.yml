name: CI

# Auch auf Feature-Branches, nicht erst im Pull Request: Ein PR entsteht in
# diesem Projekt erst nach der Abnahme durch den Projektinhaber -- ohne diesen
# Ausloeser gaebe es bis dahin keine einzige Pruefung auf fremder Hardware.
on:
  push:
  pull_request:
    branches: [main, dev]

# Ein neuer Push auf denselben Branch macht den vorherigen Lauf ueberfluessig.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, typecheck, test, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Beide von pyproject.toml zugelassenen Versionen: Auf 3.12 laeuft die
    # Entwicklung, auf 3.13 der Zielserver. Was "requires-python" verspricht,
    # soll auch geprueft sein.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    # Fuer Persistenz- und Migrationstests: echtes PostgreSQL, kein SQLite-
    # Ersatz (Sprint 1B). Die Tests lesen die Verbindung ueber
    # TEST_DATABASE_URL, siehe tests/integration/conftest.py und README.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ata
          POSTGRES_PASSWORD: ata
          POSTGRES_DB: ata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt

      # Installation ausschliesslich aus der Lock-Datei mit Hash-Verifikation
      # (ADR 0008) -- keine Versionsaufloesung zur Laufzeit der CI. Das lokale
      # Paket selbst wird ohne erneute Abhaengigkeitsaufloesung nachinstalliert.
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock.txt
          python -m pip install --no-deps -e .

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy (strict)
        run: python -m mypy src tests

      - name: Pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ata:ata@localhost:5432/ata_test
        run: python -m pytest

      # Die beiden aktiven Sonden sind kein Produktivcode, aber auch keine
      # eingefrorenen Artefakte: Sie werden erneut ausgefuehrt, wenn ein
      # Anbieter sein Angebot aendert. Ihre Tests laufen deshalb mit. Sie
      # brauchen nur die Standardbibliothek -- die Spikes mit eigenen
      # Abhaengigkeiten (ibkr-marketdata, tradingview-cdp) bleiben aussen vor.
      - name: Pytest (aktive Sonden)
        run: python -m pytest ../spikes/resc-schema/tests ../spikes/earnings-anbieter/tests

  # Der Zielserver ist ein Windows-Rechner (dort laeuft die TWS). Zwei
  # Installationsfehler sind dort bereits aufgetreten und auf macOS und Linux
  # beide unsichtbar geblieben: uvloop ohne Plattform-Marker in der
  # Lock-Datei und ein unter Windows fehlendes colorama (ADR 0015). Dieser
  # Job prueft deshalb genau das, was dort schiefgehen kann -- die
  # Installation aus der Lock-Datei und den Start des Codes.
  #
  # Ohne Datenbank: Service-Container gibt es auf Windows-Runnern nicht. Die
  # Persistenz ist plattformunabhaengig und im Linux-Job vollstaendig
  # abgedeckt.
  backend-windows:
    name: Backend unter Windows (Installation, Tests ohne Datenbank)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Dieselbe Version wie auf dem Zielserver.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock.txt
          python -m pip install --no-deps -e .

      - name: Pytest (Unit und Architektur)
        run: python -m pytest tests/unit tests/architecture

      # Beweist, dass das installierte Paket unter Windows startet und die
      # Watchlisten lesbar sind -- ohne TWS, ohne Netzwerk.
      - name: Watchlist einlesen
        run: python -m ai_trading_analyst.cli watchlist

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build

  secrets:
    name: Keine Geheimnisse im Repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Doc 10, Paragraph 20: "keine API-Schluessel oder Passwoerter im
      # Repository". Die Pruefung ist bewusst grob -- sie soll den
      # offensichtlichen Fehler abfangen, nicht Geheimnisse forensisch suchen.
      - name: .env darf nicht eingecheckt sein
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env ist eingecheckt und muss aus dem Repository entfernt werden"
            exit 1
          fi

      - name: Konfiguration enthaelt keine geheimnisverdaechtigen Schluessel
        run: |
          if grep -nEi '^[[:space:]]*[a-z_]*(password|api_key|apikey|token|secret)[[:space:]]*:' \
              config/default.yaml; then
            echo "::error::config/default.yaml enthaelt einen geheimnisverdaechtigen Schluessel"
            exit 1
          fi
